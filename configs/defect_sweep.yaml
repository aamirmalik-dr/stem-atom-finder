name: defect_sweep
mode: sweep
title: Detector performance vs vacancy fraction (dose 30, 5% dopants)
sweep:
  parameter: vacancy_fraction
  values: [0.0, 0.05, 0.10, 0.15, 0.20]
base_config:
  size: 256
  lattice: hexagonal
  spacing: 14.0
  dose: 30.0
  dopant_fraction: 0.05
images_per_condition: 5
seed: 30
refine: com
methods: [log, ncc, unet]
models:
  unet: models/unet_seg.pt
