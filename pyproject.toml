[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomfinder"
version = "0.2.1"
description = "Atomic column detection benchmark and toolkit for HAADF-STEM: materials-preset simulator, five detectors, sub-pixel refinement, and a config-driven benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aamir Malik" }]
keywords = ["electron microscopy", "HAADF-STEM", "atom detection", "atomic column", "U-Net", "sub-pixel refinement", "benchmark", "PyTorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff==0.15.22",
    "black==26.5.1",
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.25",
]

[project.urls]
Repository = "https://github.com/aamirmalik-dr/stem-atom-finder"
Issues = "https://github.com/aamirmalik-dr/stem-atom-finder/issues"
Results = "https://github.com/aamirmalik-dr/stem-atom-finder/blob/main/RESULTS.md"
Changelog = "https://github.com/aamirmalik-dr/stem-atom-finder/blob/main/CHANGELOG.md"

[project.scripts]
atomfinder = "atomfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
